name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:14@sha256:ca25035f7e6f74552655a1c5e4a9eb21f85e9d316f1f70371f790ef70095dd58
        env:
          POSTGRES_USER: packages
          POSTGRES_DB: packages_test
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis@sha256:43355efd22490e31ca14b9d569367d05121e2be61fd8e47937563ae2a80952ae
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependent libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Install pom
        working-directory: ${{ runner.temp }}
        env:
          POM_VERSION: 0.1.7
          POM_SHA256: 7a71810ac4ace04573e57303e5a775de538f7aa8bd745ba855b2fe0e2cb620a7
        run: |
          curl -fsSL --output pom.tar.gz "https://github.com/git-pkgs/pom/releases/download/v${POM_VERSION}/pom_${POM_VERSION}_linux_amd64.tar.gz"
          echo "${POM_SHA256}  pom.tar.gz" | sha256sum --check
          sudo tar -xz -f pom.tar.gz -C /usr/local/bin pom
          pom -version

      - name: Run tests
        env:
          RAILS_ENV: test
          POSTGRES_DB: packages_test
          POSTGRES_USER: packages
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: bundle exec rake db:schema:load test
